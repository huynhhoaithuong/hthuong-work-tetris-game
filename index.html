<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tetris</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
<header id="game-header">
    <h1>TETRIS</h1>
    <p>Màn 1: Chế độ cổ điển</p>
</header>

<div id="game-container">
    <div id="game-main">
        <div id="info-panel">
            <h2>THÔNG TIN</h2>
            <p>Điểm: <span id="score">0</span></p>
            <p>Số hàng đã xóa: <span id="lines">0</span></p>
            <p id="message"></p>
        </div>

        <div id="game-board">
            <table id="board"></table>
        </div>

        <div id="guide-panel">
            <h2>HƯỚNG DẪN</h2>
            <ul>
                <li><span class="keys"><kbd>←</kbd><kbd>→</kbd></span> Di chuyển trái / phải</li>
                <li><span class="keys"><kbd>↓</kbd></span> Rơi nhanh</li>
                <li><span class="keys"><kbd>↑</kbd></span> Xoay khối</li>
                <li><span class="keys"><kbd>Space</kbd></span> Rơi ngay</li>
                <li><span class="keys"><kbd>P</kbd></span> Tạm dừng</li>
            </ul>
        </div>
    </div>
</div>
<script src="index.js"></script>
</body>
</html>
